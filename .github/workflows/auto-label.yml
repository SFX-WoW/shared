name: Auto-Label

on:
  workflow_call:

jobs:
  auto-label:
    runs-on: ubuntu-latest

    if: github.event.issue.author_association != 'MEMBER'

    permissions:
      issues: write

    steps:
      - name: Apply "New" Label
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: New
